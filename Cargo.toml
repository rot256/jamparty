[package]
name = "jamparty"
version = "0.3.0"
edition = "2024"
description = "Share a site under development with a few people, peer to peer, and route their browser comments to a coding agent"
license = "MIT"
repository = "https://github.com/rot256/jamparty"
readme = "README.md"
keywords = ["browser", "cli", "development", "feedback", "proxy"]
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]
publish = ["crates-io"]
include = ["/assets/client.js", "/src", "/LICENSE", "/README.md"]

[dependencies]
bs58 = { version = "0.5.1", default-features = false }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
data-encoding = "2.11.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1", "client"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "webpki-roots", "ring", "tls12"] }
hyper-staticfile = "0.10.1"
hyper-util = { version = "0.1.20", features = ["server", "http1", "client", "client-legacy", "tokio"] }
iroh = "=1.4.1"
jiff = "0.2.35"
nix = { version = "0.31.3", features = ["hostname", "signal", "user"] }
notify = "8.2.0"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rootcause = "0.13.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
sha3 = "0.12.0"
socket2 = "0.6.5"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync", "fs", "process"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["server", "sha1_smol"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.53.1", features = ["test-util"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "getrandom", "sha1_smol"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
indexing_slicing = "warn"
must_use_candidate = "warn"
wildcard_enum_match_arm = "warn"
