name: Release

# Publishes on a pushed tag vX.Y.Z that matches the Cargo.toml version.
# workflow_dispatch retries a release that failed before publishing (pick
# the tag as the ref); any other ref fails the version check.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fail every compile step, including release builds, on any warning.
  RUSTFLAGS: -D warnings

jobs:
  version:
    name: Check tag against Cargo.toml
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare tag and package version
        id: check
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jampot") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not read the jampot package version" >&2
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Releases run on a tag; got $REF_TYPE $REF_NAME" >&2
            exit 1
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "Tag $REF_NAME does not match Cargo.toml version $version (expected v$version)" >&2
            exit 1
          fi
          echo "Releasing $REF_NAME"
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: version
    permissions:
      contents: read # the checks only read the repository
    uses: $/.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    needs:
      - version
      - checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
            target: aarch64-apple-darwin
            force-cross: false
          - name: Linux AMD64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            force-cross: true
          - name: Linux ARM64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            force-cross: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          cross-version: v0.2.5
          force-use-cross: ${{ matrix.force-cross }}
          use-rust-cache: false

      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        env:
          BINARY: target/${{ matrix.target }}/release/jampot
        run: |
          file "$BINARY"
          file "$BINARY" | grep -Eq 'statically linked|static-pie linked'

      - name: Verify macOS ARM64 binary
        if: runner.os == 'macOS'
        env:
          BINARY: target/${{ matrix.target }}/release/jampot
        run: |
          file "$BINARY"
          file "$BINARY" | grep -q 'arm64'

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/jampot-$TARGET.tar.gz" jampot
          shasum -a 256 "dist/jampot-$TARGET.tar.gz" > "dist/jampot-$TARGET.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jampot-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs:
      - version
      - checks
      - build
    runs-on: ubuntu-24.04
    # The registry token is an environment secret, so only this job, under
    # the environment's protection rules, can read it.
    environment: crates-io
    permissions:
      contents: read # check out the crate sources
      id-token: write # crates.io trusted publishing (OIDC)
    env:
      CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A token is required for the first release. Once trusted publishing is
      # configured on crates.io, remove the secret to use short-lived OIDC tokens.
      - name: Authenticate with crates.io
        if: env.CRATES_IO_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --locked

  release:
    name: Publish GitHub release
    needs:
      - version
      - build
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release and upload assets

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            gh release upload "$RELEASE_TAG" dist/* --clobber
          fi
