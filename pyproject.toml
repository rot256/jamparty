[project]
name = "jampot-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "playwright>=1.63.0",
  "pytest>=8.4",
  "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The framework tests run real dev servers (slow, and they need tools of
# their own; see tests/test_frameworks.py): `uv run pytest -m frameworks`.
addopts = ["-m", "not frameworks"]
markers = ["frameworks: real dev servers through jampot (uv run pytest -m frameworks)"]

[tool.basedpyright]
typeCheckingMode = "standard"
