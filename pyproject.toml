[project]
name = "jamparty-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "playwright>=1.63.0",
  "pytest>=8.4",
  "ruff>=0.16.8",
]
frameworks = [
  "django==6.1.3",
  "mkdocs==1.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The framework tests run real dev servers (slow, and they need tools of
# their own; see tests/test_frameworks.py): `uv run pytest -m frameworks`.
addopts = ["-m", "not frameworks"]
markers = ["frameworks: real dev servers through jamparty (uv run pytest -m frameworks)"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.uv]
default-groups = ["dev", "frameworks"]

# The framework tests' dev servers and what they pull in: releases at
# least 14 days old.
[tool.uv.exclude-newer-package]
asgiref = "14 days"
click = "14 days"
django = "14 days"
ghp-import = "14 days"
jinja2 = "14 days"
markdown = "14 days"
markupsafe = "14 days"
mergedeep = "14 days"
mkdocs = "14 days"
mkdocs-get-deps = "14 days"
pathspec = "14 days"
platformdirs = "14 days"
python-dateutil = "14 days"
pyyaml = "14 days"
pyyaml-env-tag = "14 days"
six = "14 days"
sqlparse = "14 days"
tzdata = "14 days"
watchdog = "14 days"
