# cargo-deny: RustSec advisories, licenses, banned crates and sources.
# Run locally with `cargo deny check`; CI runs it on every push, pull
# request and daily (new advisories appear without any change here).

[graph]
all-features = true
# Only the platforms jamparty ships for or is developed on: crates that only
# Windows builds pull in (e.g. iroh's wmi -> chrono) do not reach the
# shipped binaries; Windows `cargo install` users are not covered.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Vulnerabilities, unmaintained and unsound crates fail by default
# (RustSec advisory database); yanked versions fail too. To accept an
# advisory, list it under `ignore` with the reason.
[advisories]
yanked = "deny"
ignore = [
]

# Permissive licenses only (MPL-2.0 is file-level copyleft, compatible
# with shipping an MIT binary).
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions come from iroh's and the Windows crates' trees; they
# cost build time, not correctness.
multiple-versions = "warn"
wildcards = "deny"

# Only crates.io; no git dependencies.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
