<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="jamjam">
  <title>jamjam</title>
  <!-- two flat soft cookies with raspberry jam between, three-quarter view -->
  <ellipse cx="64" cy="106" rx="50" ry="9" fill="#000" opacity=".1"/>
  <!-- bottom cookie -->
  <ellipse cx="64" cy="84" rx="50" ry="17" fill="#a96c2f"/>
  <rect x="14" y="74" width="100" height="10" fill="#a96c2f"/>
  <!-- jam -->
  <ellipse cx="64" cy="74" rx="51" ry="17" fill="#9c1631"/>
  <rect x="13" y="68" width="102" height="6" fill="#9c1631"/>
  <ellipse cx="64" cy="68" rx="51" ry="17" fill="#c0233f"/>
  <rect x="38" y="84" width="7" height="12" rx="3.5" fill="#b01d38"/>
  <rect x="80" y="86" width="6" height="9" rx="3" fill="#b01d38"/>
  <!-- top cookie -->
  <ellipse cx="64" cy="66" rx="50" ry="17" fill="#b97a37"/>
  <rect x="14" y="56" width="100" height="10" fill="#b97a37"/>
  <ellipse cx="64" cy="56" rx="50" ry="17" fill="#dfa55c"/>
  <ellipse cx="64" cy="55" rx="42" ry="13" fill="#e8b571"/>
  <!-- sugar specks -->
  <g fill="#f8e2bb">
    <circle cx="46" cy="52" r="1.8"/><circle cx="62" cy="47" r="1.6"/><circle cx="80" cy="51" r="1.8"/>
    <circle cx="54" cy="60" r="1.5"/><circle cx="72" cy="58" r="2"/><circle cx="90" cy="58" r="1.4"/>
    <circle cx="38" cy="58" r="1.3"/><circle cx="66" cy="65" r="1.4"/>
  </g>
</svg>
