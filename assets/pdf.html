<!doctype html>
<html lang="en" data-jamparty-pdf>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF viewer · jamparty</title>
  <link rel="stylesheet" href="/_jamparty/pdf.css">
  <script type="module" src="/_jamparty/pdf.js"></script>
</head>
<body>
  <nav aria-label="PDF controls">
    <label>Page <input id="pdf-page" type="number" min="1" value="1" disabled></label>
    <span id="pdf-count"></span>
    <label>Zoom <select id="pdf-zoom">
      <option value="fit">Fit width</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
    </select></label>
    <span id="pdf-status" role="status">Loading PDF…</span>
  </nav>
  <main id="pdf-pages" aria-label="PDF pages"></main>
</body>
</html>
