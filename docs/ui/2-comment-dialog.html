<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comment dialog</title>
</head>
<body>


<style>
body{margin:0}
a{color:#24604e}a:hover{color:#143b30}
</style>

<div style="width: 1100px; height: 760px; position: relative; background: #ecebe7; color: #222222; font-family: Georgia, serif; overflow: hidden">
<div style="max-width: 720px; margin: 0 auto; padding: 48px 20px 0">
<h1 style="font-size: 38px; line-height: 1.15; margin: 0 0 14px">Short Preimages, Small Fields</h1>
<p style="font-size: 19px; line-height: 1.6; color: #444444; margin: 0">We fold instances of a lookup relation over a 31-bit field without leaving it for an extension.</p>
<div style="border: 1px solid #dddddd; border-radius: 6px; padding: 16px 20px; margin: 24px 0; background: #f0efed">
<h3 style="margin: 4px 0 8px; font-size: 19px">Construction</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.6; outline: 2px solid #eb5e28; background: rgb(235 94 40 / 10%)">Commit to the witness with an Ajtai commitment, then prove the norm bound with a single sumcheck.</p>
</div>
<a href="#" style="display: inline-block; font: 600 15px system-ui, sans-serif; padding: 12px 16px; border-radius: 6px; background: #24604e; color: #ffffff; text-decoration: none">Read the note</a>
</div>
<div role="dialog" aria-label="Comment" style="position: absolute; left: 562px; top: 338px; width: 420px; border: 1px solid #444444; border-radius: 7px; background: #f8f7f4; color: #161616; box-shadow: 0 16px 48px rgb(0 0 0 / 28%); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<label for="suggestion" style="font-weight: 700">Comment:</label>
<textarea id="suggestion" rows="5" style="font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px 10px; border: 2px solid #287088; border-radius: 4px; background: #ffffff; resize: vertical">Say which norm (ℓ∞ or ℓ2) the bound is in.</textarea>
<div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 14px">
<button type="button" style="padding: 6px 10px; border: 1px solid #444444; border-radius: 4px; background: #ffffff; font: 600 12px ui-monospace, Menlo, monospace">Cancel</button>
<button type="button" style="padding: 6px 12px; border: 1px solid #161616; border-radius: 4px; background: #161616; color: #ffffff; font: 600 12px ui-monospace, Menlo, monospace">Queue comment</button>
</div>
</div>
<button type="button" style="position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 9px; border: 1px solid rgb(255 255 255 / 30%); border-radius: 999px; background: #161616; color: #ffffff; box-shadow: 0 3px 12px rgb(0 0 0 / 22%); font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><span role="img" aria-label="Connected" style="display: block; width: 10px; height: 10px; border-radius: 50%; background: #2f9e44"></span>0 queued</button>
</div>

</body>
</html>
