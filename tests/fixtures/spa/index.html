<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jampot SPA fixture</title>
    <style>
      body { margin: 0; font: 18px/1.6 system-ui, sans-serif; }
      nav { padding: 16px 40px; background: #eee; }
      main { padding: 40px; }
      #board { width: 600px; height: 300px; background: #f4f1eb; }
    </style>
  </head>
  <body>
    <nav>
      <a id="to-home" href="/">Home</a>
      <a id="to-other" href="/other">Other</a>
    </nav>
    <main>
      <h1 id="title">Home</h1>
      <div id="board"></div>
    </main>
    <script>
      // A single-page app: links change the route without loading a page.
      const render = () => {
        document.getElementById("title").textContent =
          location.pathname === "/other" ? "Other" : "Home";
      };
      for (const link of document.querySelectorAll("nav a")) {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          history.pushState({}, "", link.getAttribute("href"));
          render();
        });
      }
      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
